name: MailForm tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  integration:
    name: PHP ${{ matrix.php }} / ${{ matrix.database.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database:
          - { driver: mariadb, image: 'mariadb:11.4' }
          - { driver: mariadb, image: 'mariadb:11.8' }
          - { driver: mysql, image: 'mysql:8.4' }
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_DATABASE: mailform_test
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="if command -v mariadb-admin >/dev/null; then mariadb-admin ping -h localhost -pci-only; else mysqladmin ping -h localhost -pci-only; fi"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, fileinfo
          tools: composer:v2
          coverage: none
      - name: Check the AlmaLinux setup and backup import commands
        if: matrix.php == '8.4' && matrix.database.image == 'mariadb:11.8'
        run: |
          shellcheck -x -P deploy/almalinux10 -s bash deploy/almalinux10/*.sh
          php -l deploy/almalinux10/target.php
          bash deploy/almalinux10/setup.sh --help
          bash deploy/almalinux10/import-backup.sh --help
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer validate --strict && composer audit
      - run: cp .env.example .env && vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.database.driver }}
          DB_DATABASE: mailform_test
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
          DB_PASSWORD: ci-only
      - name: Check the official EasyMail 2.00 files for this rehearsal
        if: matrix.database.image == 'mariadb:11.8'
        env:
          SOURCE_VERSION: ${{ matrix.php == '8.4' && '2.00.125' || '2.00.124' }}
        run: |
          case "$SOURCE_VERSION" in
            2.00.124) digest=e6feee0db39b76264c821eef2b545d64e048853bc0d1dd651e07e95c2b7d51fc ;;
            2.00.125) digest=cd5ca372d19b64450107c4014ff6c31b8a8d50cf84822d7fa54d797cd171b4e1 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/EasyMail_$SOURCE_VERSION.zip"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://www.mubag.com/download/$SOURCE_VERSION/EasyMail_$SOURCE_VERSION.zip" -o "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          base="EasyMail_$SOURCE_VERSION/em_laravel"
          unzip -q "$archive" "$base/config/app.php" "$base/config/append.php" "$base/routes/web.php" \
            "$base/app/Http/Controllers/IndexController.php" "$base/app/Library/Common.php" "$base/app/Mail/ContactMail.php" \
            "$base/resources/views/theme/*" "$base/resources/lang/*" -d "$RUNNER_TEMP"
          jq -r 'to_entries[] | "\(.value)  \(.key)"' "resources/easymail/$SOURCE_VERSION-sha256.json" | \
            (cd "$RUNNER_TEMP/$base" && sha256sum --check --quiet)
          echo "EASYMAIL_SOURCE_ROOT=$RUNNER_TEMP/$base" >> "$GITHUB_ENV"
      - name: Rehearse a second snapshot from a read-only legacy database
        env:
          CONTAINER_ID: ${{ job.services.database.id }}
          DB_CONNECTION: ${{ matrix.database.driver }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_DATABASE: mailform_handoff
          DB_USERNAME: root
          DB_PASSWORD: ci-only
          LEGACY_DB_DRIVER: ${{ matrix.database.driver }}
          LEGACY_DB_HOST: 127.0.0.1
          LEGACY_DB_PORT: ${{ job.services.database.ports[3306] }}
          LEGACY_DB_DATABASE: easymail_snapshot
          LEGACY_DB_USERNAME: legacy_reader
          LEGACY_DB_PASSWORD: ci-reader
          MAILFORM_DELIVERY_ENABLED: 'false'
          APP_URL: https://forms.example.test
        run: |
          db() { docker exec -i -e MYSQL_PWD="$DB_PASSWORD" "$CONTAINER_ID" "$DB_CONNECTION" --user=root "$@"; }
          db <<'SQL'
          CREATE DATABASE mailform_handoff CHARACTER SET utf8mb4;
          CREATE DATABASE easymail_snapshot CHARACTER SET utf8mb4;
          CREATE USER 'legacy_reader'@'%' IDENTIFIED BY 'ci-reader';
          GRANT SELECT ON easymail_snapshot.* TO 'legacy_reader'@'%';
          SQL
          db easymail_snapshot < tests/Fixtures/easymail-2.01.004.sql
          php artisan key:generate --force
          php artisan migrate --force
          options=(--source-version=2.01.004)
          if [[ -n ${EASYMAIL_SOURCE_ROOT:-} ]]; then
            db easymail_snapshot <<'SQL'
          CREATE TABLE migrations (migration VARCHAR(255));
          INSERT INTO migrations VALUES ('2020_02_20_174440_create_forms_table');
          CREATE TABLE cache (`key` VARCHAR(255), value TEXT, expiration INTEGER);
          UPDATE histories SET attach_files = CONCAT(REPEAT('a', 40), '.txt') WHERE id = 80;
          SQL
            files="$EASYMAIL_SOURCE_ROOT/storage/app/attach_file"
            mkdir -p "$files"
            printf 'fixture' > "$files/$(printf 'a%.0s' {1..40}).txt"
            options=(--source-root="$EASYMAIL_SOURCE_ROOT" --source-base="$APP_URL" --strict)
          fi
          import() { php artisan easymail:import "${options[@]}" --json "$@"; }
          import --dry-run > "$RUNNER_TEMP/diagnosis.json"
          if [[ -n ${EASYMAIL_SOURCE_ROOT:-} ]]; then
            jq -e '.extra_tables == [] and .forms[0].same_public_url and .forms[0].resolved_files == 1' "$RUNNER_TEMP/diagnosis.json"
          fi
          import > "$RUNNER_TEMP/first.json"
          db easymail_snapshot -e 'INSERT INTO histories (id, form_id, content, created_at, updated_at) SELECT 81, form_id, content, created_at, updated_at FROM histories WHERE id = 80'
          status=0
          import --verify-only > "$RUNNER_TEMP/before.json" || status=$?
          test "$status" = 2
          jq -e '.reconciliation.forms[0].source.missing == 1' "$RUNNER_TEMP/before.json"
          import > "$RUNNER_TEMP/final.json"
          import --verify-only | jq -e '.reconciliation.ok and .reconciliation.forms[0].source.matched == 2'
          php artisan mailform:handoff --require-empty
