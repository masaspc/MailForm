# Include only in the HTTPS server for the MailForm host.
location ^~ / {
    client_max_body_size 24m;
    if (-f /etc/nginx/mailform/maintenance) { return 503; }

    location ~ ^/(?<mailform_static>assets/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.(?:css|js|txt|json\.gz)|favicon\.ico|robots\.txt)$ {
        alias /srv/mailform/current/public/$mailform_static;
        disable_symlinks on from=/srv/mailform/current/public;
    }
    location ~ (?:^|/)\. { return 404; }
    location ~ ^/(?:assets|storage)(?:/|$) { return 404; }

    fastcgi_param SCRIPT_NAME /index.php;
    include /etc/nginx/mailform/fastcgi.conf;
}
