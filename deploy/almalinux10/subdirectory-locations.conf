# Include inside the existing HTTPS server. Keep other site locations in place.
location = /contact-form {
    return 308 /contact-form/$is_args$args;
}

location ^~ /contact-form/ {
    client_max_body_size 24m;
    if (-f /etc/nginx/mailform/maintenance) { return 503; }

    location ~ ^/contact-form/(?<mailform_static>assets/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.(?:css|js|txt|json\.gz)|favicon\.ico|robots\.txt)$ {
        alias /srv/mailform/current/public/$mailform_static;
        disable_symlinks on from=/srv/mailform/current/public;
    }
    location ~ (?:^|/)\. { return 404; }
    location ~ ^/contact-form/(?:assets|storage)(?:/|$) { return 404; }

    fastcgi_param SCRIPT_NAME /contact-form/index.php;
    include /etc/nginx/mailform/fastcgi.conf;
}
